version: 1
engines:
  primary: pi
models:
  cheap: zai/glm-5.3-flash
  strong: null # Fill with approved Tier-1 provider/model; otherwise needs_review
routing:
  low: cheap
  medium: cheap
  high: strong_or_review
  blocked: reject
  maxCheapRetries: 1
  forbidPolicyOverrideByModel: true
safety:
  allowExternalModels: false # switch only after organization approval
  requireSandboxForExecution: true
  defaultNetwork: deny
quality:
  required:
    - path-scope
    - dependency-policy
    - types
    - lint
    - tests
